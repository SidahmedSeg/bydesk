name: build-windows-bydesk

# Slim x64 Windows build for ByDesk: produces an unsigned portable build folder as an artifact.
# Mirrors the proven Windows steps from flutter-build.yml (toolchain pins, vcpkg, bridge codegen).

on:
  workflow_dispatch:
  push:
    branches: [bydesk-v1]
    paths:
      - ".github/workflows/build-windows-bydesk.yml"

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  FRB_VERSION: "1.80.1"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Precache + patch Flutter (dropdown enableFilter)
        shell: bash
        run: |
          flutter precache --windows
          flutter_root="$(dirname "$(dirname "$(which flutter)")")"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$flutter_root"
          ( cd "$flutter_root" && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff )

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg (with binary cache)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (manifest mode + overlay ports)
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed" \
            || { find "$VCPKG_ROOT/buildtrees" -name "*-out.log" -exec sh -c 'echo "== $1 =="; tail -n 60 "$1"' _ {} \; ; exit 1; }

      - name: Flutter pub get
        shell: bash
        run: cd flutter && flutter pub get

      - name: Verify committed Rust<->Dart bridge
        # Bridge is vendored (generated_bridge.dart + .freezed.dart) so Windows builds the exact
        # same Dart that compiles on macOS. Avoids a fresh codegen producing a mismatched bridge.
        shell: bash
        run: |
          test -f flutter/lib/generated_bridge.dart || { echo "missing generated_bridge.dart"; exit 1; }
          grep -q "class RustdeskImpl" flutter/lib/generated_bridge.dart || { echo "bridge missing RustdeskImpl"; exit 1; }
          echo "committed bridge present"

      - name: Build ByDesk (Windows x64, Flutter)
        shell: bash
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          # --skip-portable-pack: build.py's built-in packer hardcodes `rustdesk.exe`
          # as the self-extractor's startup binary. We ship `bydesk.exe`, and
          # generate.py does NOT validate that the entry point exists -- it would
          # silently produce an installer that unpacks and then launches nothing.
          # We pack manually below with the correct entry point instead.
          python3 ./build.py --flutter --hwcodec --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./ByDesk

      - name: Resolve version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          SHA_SHORT=$(git rev-parse --short HEAD)
          PKG="ByDesk-${VERSION}-b${{ github.run_number }}-${SHA_SHORT}-x86_64"
          echo "VERSION=$VERSION"   >> "$GITHUB_ENV"
          echo "SHA_SHORT=$SHA_SHORT" >> "$GITHUB_ENV"
          echo "PKG=$PKG"           >> "$GITHUB_ENV"
          echo "packaging as: ${PKG}-install.exe"

      - name: Build self-extracting installer (single file)
        shell: bash
        run: |
          set -e
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          # -e must point at OUR renamed binary, else the extractor launches nothing.
          python3 ./generate.py -f ../../ByDesk/ -o . -e ../../ByDesk/bydesk.exe
          popd
          test -f ./target/release/rustdesk-portable-packer.exe \
            || { echo "::error::portable packer was not produced"; exit 1; }
          mv ./target/release/rustdesk-portable-packer.exe "./${PKG}-install.exe"
          ls -lh "./${PKG}-install.exe"

      - name: Upload installer (single self-contained exe)
        uses: actions/upload-artifact@v4
        with:
          name: ByDesk-installer-${{ env.VERSION }}-b${{ github.run_number }}
          path: "*-install.exe"
          if-no-files-found: error

      - name: Upload portable folder (all files required together)
        uses: actions/upload-artifact@v4
        with:
          name: ByDesk-portable-${{ env.VERSION }}-b${{ github.run_number }}
          path: ByDesk
          if-no-files-found: error
